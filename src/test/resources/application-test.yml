# 테스트용 PostgreSQL (CI는 postgres:17 서비스 컨테이너, 로컬은 docker compose)
spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/submanager_test}
    username: ${TEST_DB_USERNAME:submanager}
    password: ${TEST_DB_PASSWORD:submanager}

app:
  social:
    kakao:
      app-id: ${KAKAO_APP_ID:123456}
    google:
      client-id: ${GOOGLE_WEB_CLIENT_ID:local-google-client-id.apps.googleusercontent.com}
  jwt:
    secret: test-only-jwt-secret-0123456789abcdefghijklmnop
