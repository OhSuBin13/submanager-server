spring:
  application:
    name: submanager-server
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway만 바꾼다
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: smtp.resend.com
    port: 587
    username: resend
    password: ${RESEND_API_KEY:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}   # 인증 메일 링크의 서버 주소
  mail-from: ${MAIL_FROM:no-reply@localhost}
  social:
    kakao:
      app-id: ${KAKAO_APP_ID:0}
    google:
      client-id: ${GOOGLE_WEB_CLIENT_ID:unset}
      jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl: 1h
    refresh-token-ttl: 30d
  reminder:
    default-days-before: 3
    default-time: "09:00"
  firebase:
    credentials-base64: ${FIREBASE_CREDENTIALS_BASE64:}

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false   # Resend SMTP 연결 여부로 서버 헬스가 DOWN 되지 않도록 제외
