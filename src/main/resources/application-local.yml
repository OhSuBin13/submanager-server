# 로컬 개발: `docker compose up -d`로 띄운 PostgreSQL 17 사용
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/submanager}
    username: ${DB_USERNAME:submanager}
    password: ${DB_PASSWORD:submanager}
  jpa:
    show-sql: true

management:
  endpoint:
    health:
      show-details: always   # 로컬에서는 어떤 항목이 DOWN인지 보이도록

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-only-jwt-secret-change-me-0123456789}
